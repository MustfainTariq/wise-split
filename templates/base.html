<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ramadan Expense Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root {
        --bg1: #0b1020;
        --bg2: #131f3f;
        --glass: rgba(255, 255, 255, 0.14);
        --glass-strong: rgba(255, 255, 255, 0.2);
        --text: #eaf0ff;
        --muted: #c6d1f5;
        --accent: #7ef7cf;
      }
      body {
        min-height: 100vh;
        color: var(--text);
        background:
          radial-gradient(circle at 15% 20%, #293f78 0, transparent 45%),
          radial-gradient(circle at 85% 15%, #1f9a80 0, transparent 35%),
          linear-gradient(120deg, var(--bg1), var(--bg2));
      }
      .glass {
        background: var(--glass);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 1rem;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 12px 35px rgba(3, 8, 26, 0.32);
      }
      .card, .table, .table thead th {
        color: var(--text);
      }
      .card {
        background: var(--glass);
        border: 1px solid rgba(255,255,255,0.22);
        border-radius: 1rem;
        backdrop-filter: blur(14px);
      }
      .navbar-glass {
        background: var(--glass-strong);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 999px;
        backdrop-filter: blur(12px);
      }
      .table {
        --bs-table-bg: transparent;
        --bs-table-striped-bg: rgba(255, 255, 255, 0.04);
        --bs-table-color: var(--text);
      }
      .table-light {
        --bs-table-bg: rgba(255,255,255,0.1);
      }
      .form-control, .form-select {
        background: rgba(255,255,255,0.88);
      }
      .text-muted, .muted {
        color: var(--muted) !important;
      }
      .badge-soft {
        background: rgba(126, 247, 207, 0.2);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="container py-3">
      <nav class="navbar navbar-expand-lg navbar-dark navbar-glass px-3 mb-4">
        <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">Ramadan Split</a>
        <div class="navbar-nav ms-auto gap-1">
          <a class="nav-link" href="{{ url_for('new_log') }}">Add Meal</a>
          <a class="nav-link" href="{{ url_for('catalog') }}">Catalog</a>
        </div>
      </nav>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show glass" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
