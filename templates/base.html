<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ramadan Expense Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background: #f8f9fb; }
      .card { border: none; box-shadow: 0 0.2rem 0.9rem rgba(0,0,0,0.05); }
      .navbar-brand { font-weight: 700; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('dashboard') }}">Ramadan Split</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="{{ url_for('new_log') }}">Add Meal</a>
          <a class="nav-link" href="{{ url_for('catalog') }}">Catalog Settings</a>
        </div>
      </div>
    </nav>

    <main class="container pb-5">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
