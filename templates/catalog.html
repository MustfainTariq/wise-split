{% extends 'base.html' %}
{% block title %}Catalog Settings | Ramadan Split{% endblock %}

{% block content %}
<div class="row g-4">
  <div class="col-lg-4">
    <div class="card p-3">
      <h5>Add Catalog Item</h5>
      <form method="post" class="mt-3">
        <div class="mb-3">
          <label class="form-label">Item Name</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Default Price (Rs)</label>
          <input type="number" step="0.01" min="0" name="default_price" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Category</label>
          <select name="category" class="form-select" required>
            {% for cat in categories %}
              <option value="{{ cat }}">{{ cat }}</option>
            {% endfor %}
          </select>
        </div>
        <button class="btn btn-success w-100" type="submit">Add Item</button>
      </form>
    </div>
  </div>

  <div class="col-lg-8">
    <div class="card p-3">
      <h5 class="mb-3">Manage Existing Items</h5>
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead>
            <tr>
              <th>Name</th>
              <th>Default Price</th>
              <th>Category</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            {% for item in items %}
            <tr>
              <form method="post" action="{{ url_for('update_catalog_item', item_id=item.id) }}">
                <td><input class="form-control" name="name" value="{{ item.name }}" required></td>
                <td><input class="form-control" type="number" min="0" step="0.01" name="default_price" value="{{ item.default_price }}" required></td>
                <td>
                  <select class="form-select" name="category">
                    {% for cat in categories %}
                      <option value="{{ cat }}" {% if cat == item.category %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                  </select>
                </td>
                <td class="d-flex gap-2">
                  <button class="btn btn-sm btn-outline-primary" type="submit">Update</button>
              </form>
              <form method="post" action="{{ url_for('delete_catalog_item', item_id=item.id) }}" onsubmit="return confirm('Delete this item?');">
                <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
              </form>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="4" class="text-center">No catalog items yet.</td></tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
